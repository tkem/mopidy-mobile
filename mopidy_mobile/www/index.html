<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{{title}}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="viewport-fit=cover,width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="color-scheme" content="light dark">

    <!-- Android/Chrome -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#119831">
    <link rel="manifest" href="{{static_url('manifest.json')}}">
    <link rel="icon" sizes="192x192" href="{{static_url('images/icon-192x192.png')}}">
    <link rel="icon" sizes="144x144" href="{{static_url('images/icon-144x144.png')}}">
    <link rel="icon" sizes="96x96" href="{{static_url('images/icon-96x96.png')}}">
    <link rel="icon" sizes="72x72" href="{{static_url('images/icon-72x72.png')}}">

    <!-- iOS/Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{{title}}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{static_url('images/apple-touch-icon-180x180.png')}}">
    <link rel="apple-touch-icon" sizes="152x152" href="{{static_url('images/apple-touch-icon-152x152.png')}}">
    <link rel="apple-touch-icon" sizes="120x120" href="{{static_url('images/apple-touch-icon-120x120.png')}}">
    <link rel="apple-touch-icon" sizes="76x76" href="{{static_url('images/apple-touch-icon-76x76.png')}}">
    <link rel="apple-touch-startup-image" href="{{static_url('images/splash-320x480.png')}}">

    <!-- application files built by "npm run dist" -->
    <link rel="stylesheet" href="{{static_url('styles.css')}}">
    <script src="{{static_url('polyfills.js')}}" type="module"></script>
    <script src="{{static_url('main.js')}}" type="module"></script>
  </head>
  <body data-version="{{version}}" data-web-socket-url="{{ws_url}}">
    <app-root></app-root>
  </body>
</html>
